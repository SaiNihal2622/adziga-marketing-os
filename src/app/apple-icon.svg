  <g transform="rotate(-14 70 158)">
    <rect x="36" y="148" width="80" height="20" rx="10" fill="#FFFFFF"/>
  </g>
  <circle cx="76" cy="208" r="12" fill="#FFFFFF"/>

  <!-- RIGHT CLUSTER — orange shapes -->
